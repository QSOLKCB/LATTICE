name: validate-lattice

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python3 -m compileall -q lattice tools tests
      - name: Deterministic quality gate
        run: python3 tools/quality_gate.py
      - name: Validate contracts
        run: python3 tools/validate_lattice.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
